<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Galaxy Map 40K</title>
  <meta name="description" content="Interactive fan map of the Warhammer 40,000 galaxy with planets, events and books.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="library" aria-label="Horus Heresy library" hidden>
      <div class="lib-head">
        <div>
          <h2>Horus Heresy Library</h2>
          <div class="lib-count" id="lib-count"></div>
        </div>
        <button type="button" class="lib-close" id="lib-close" aria-label="Close library" title="Close library">×</button>
      </div>
      <div class="lib-filters">
        <input id="lib-filter" type="search" placeholder="Filter by title, author, Legion, character" autocomplete="off" aria-label="Filter books">
        <div class="lib-row">
          <select id="lib-series" aria-label="Series">
            <option value="">All series</option>
          </select>
          <select id="lib-legion" aria-label="Legion or faction">
            <option value="">All Legions &amp; factions</option>
          </select>
        </div>
        <div class="lib-sort" role="group" aria-label="Sort order">
          <button type="button" data-sort="series" aria-pressed="true">Reading order</button>
          <button type="button" data-sort="chrono" aria-pressed="false">In-universe</button>
        </div>
      </div>
      <div class="lib-list" id="lib-list"></div>
    </aside>

    <main id="map-wrap">
      <svg id="map" aria-label="Galaxy map"></svg>

      <header class="topbar">
        <h1 class="brand">Galaxy Map <span id="brand-era">40K</span></h1>
        <div class="era-toggle" role="group" aria-label="Era">
          <button type="button" data-era="30k" aria-pressed="false"><b>30K</b><span> · Horus Heresy</span></button>
          <button type="button" data-era="40k" aria-pressed="true"><b>40K</b><span> · Dark Imperium</span></button>
        </div>
        <button type="button" class="lib-toggle" id="lib-toggle" aria-controls="library" aria-expanded="false">📚 <span>Library</span></button>
        <div class="search">
          <input id="search" type="search" placeholder="Search planets, events or books" autocomplete="off" aria-label="Search">
          <ul id="search-results" role="listbox" hidden></ul>
        </div>
      </header>

      <div class="zoom-controls" role="group" aria-label="Zoom">
        <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zoom-reset" title="Whole galaxy" aria-label="Whole galaxy">⌂</button>
      </div>

      <div class="legend">
        <span><i class="dot dot-sys"></i>System</span>
        <span><i class="dot dot-major"></i>Major system</span>
        <span><i class="dot dot-warp"></i>Warp anomaly</span>
        <span class="legend-lib"><i class="dot dot-lib"></i>World in selected books</span>
      </div>
    </main>

    <aside id="panel" aria-live="polite">
      <div class="panel-handle" id="panel-handle" aria-hidden="true"></div>
      <nav class="crumbs" id="crumbs"></nav>
      <div id="panel-body"></div>
      <footer class="disclaimer">
        Unofficial fan project, not affiliated with Games Workshop. Warhammer 40,000 is a trademark of Games Workshop Ltd. Positions are schematic.
      </footer>
    </aside>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
